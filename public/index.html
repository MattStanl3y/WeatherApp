<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="search-section">
        <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>

        <form id="weatherForm">
          <input
            type="text"
            id="cityInput"
            placeholder="Enter city name"
            required
          />
          <button type="submit"><i class="fas fa-search"></i> Search</button>
        </form>

        <div class="location-button-container">
          <button id="locationButton" type="button">
            <i class="fas fa-map-marker-alt"></i> Use My Location
          </button>
        </div>

        <!-- 3 dots loading icon-->
        <div class="loader" id="loader">
          <div></div>
          <div></div>
          <div></div>
        </div>

        <div class="error-message" id="errorMessage"></div>
      </div>

      <div id="weatherInfo" class="hidden">
        <h2 id="cityName"></h2>
        <div class="forecast-container">
          <div class="forecast-card today">
            <h3>Today</h3>
            <div class="weather-icon-container">
              <i id="todayIcon" class="fas fa-sun fa-3x"></i>
            </div>
            <div class="temp-display"><span class="temperature"></span>°F</div>
            <div class="description-display">
              <span class="description"></span>
            </div>
            <div class="weather-details">
              <p>Humidity: <span class="humidity"></span>%</p>
              <p>Wind Speed: <span class="windSpeed"></span> mph</p>
            </div>
          </div>

          <div id="futureForecast" class="future-forecast"></div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
